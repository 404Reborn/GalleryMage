<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <title>Restablecer contraseña · GalleryMage</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <main class="auth-screen">
            <section class="auth-card" aria-labelledby="reset-heading">
                <a class="auth-brand" href="/" aria-label="GalleryMage, inicio">
                    <span class="brand-mark" aria-hidden="true">G</span>
                    <span>GalleryMage</span>
                </a>
                <p class="auth-eyebrow">RECUPERACIÓN DE CUENTA</p>
                <h1 id="reset-heading">Elige una contraseña nueva</h1>
                <p class="auth-description">
                    El enlace caduca a los 20 minutos y solo se puede usar una vez.
                </p>
                <form id="reset-form" class="auth-form">
                    <label for="reset-password">Nueva contraseña</label>
                    <input id="reset-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
                    <label for="reset-password-confirm">Repite la contraseña</label>
                    <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
                    <p id="reset-message" class="form-message" role="status" aria-live="polite" hidden></p>
                    <button id="reset-submit" class="primary-button" type="submit">Cambiar contraseña</button>
                </form>
                <a class="auth-link" href="/">Volver al inicio de sesión</a>
            </section>
        </main>
        <script type="module" src="js/reset-password.js"></script>
    </body>
</html>
